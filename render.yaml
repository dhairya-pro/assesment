# Recommended: ONE web service (API + built React app). Delete separate frontend service.
services:
  - type: web
    name: ai-travel
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set in dashboard:
      # MONGODB_URI, JWT_SECRET, GEMINI_API_KEY
      # CLIENT_URL=https://ai-travel.onrender.com
      # For same-origin API when using bundled frontend, set before build in client:
      # VITE_API_URL=/api  (build runs via server/scripts/sync-client.js)
