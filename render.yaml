# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-travel-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: ai-travel-web
    runtime: node
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set in Render dashboard (required before build):
      # VITE_API_URL=https://ai-travel-api.onrender.com/api
